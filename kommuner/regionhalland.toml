# Region Halland. Schemat står i kommunhandlingars docs/03-ARKITEKTUR.md
# (kommunkonfigurationen och adaptern Meetings Plus, ADR-0080), och hur
# regionen publicerar i README.md.
#
# Organen står i den ordning de hämtas, och adressen till varje organs sida
# under [kalla.sidor]. Sidan listar alla organets möten.

namn = "Region Halland"

# Menyn och regionens sida delar in organen i grupperna (K39).
# Bilagorna visar bara härkomsten på webbplatsen, så att den ryms under
# GitHub Pages gräns (K18, ADR-0080 i kommunhandlingar).
sidor_med_text = ["kallelse", "protokoll"]

grupper = ["Regionfullmäktige och regionstyrelsen", "Driftnämnderna och nämnderna", "Råd och övriga"]

[[organ]]
id = "rf"
namn = ["Regionfullmäktige"]
grupp = "Regionfullmäktige och regionstyrelsen"

