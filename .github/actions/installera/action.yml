# Kontrollen, nattkörningen och webbplatsen installerar koden här (K101,
# ADR-0124 i kungsbackakommuns serie).
name: Kommunhandlingar
description: Installerar Python 3.12 och kommunhandlingar på commiten i kodversion.txt.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "$(cat kodversion.txt)"
