# Upptäckt och steg 2 för de levande källorna i varje kommunfil (K103,
# ADR-0126 i kungsbackakommuns serie). Samma kod som kungsbackakommuns
# .github/actions/levande; håll dem lika. Skillnaden: inga flaggor till
# steg 2, eftersom regionens nattkörning inte har några.
name: De levande källorna
description: Upptäckt och steg 2 för varje kommunfil.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for kommunfil in kommuner/*.toml; do
          # Upptäckten skriver inget i data/. Stoppas den av en källa (kod 3)
          # går körningen vidare; varje annat fel stoppar den (ADR-0061).
          kod=0
          python -m kommunhandlingar.upptack "$kommunfil" "$RUNNER_TEMP/arbete" \
            | tee -a "$RUNNER_TEMP/sammanfattning.txt" || kod=$?
          if [ "$kod" -eq 3 ]; then
            echo "Det levande i $kommunfil hoppas över; nästa körning försöker igen." \
              | tee -a "$RUNNER_TEMP/sammanfattning.txt"
            continue
          fi
          [ "$kod" -eq 0 ] || exit "$kod"
          .github/nattkorning/hamta_i_delar.sh "$kommunfil"
        done
