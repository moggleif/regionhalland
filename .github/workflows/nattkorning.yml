# Nattkörningen för Region Halland: upptäckt och steg 2 med kommunhandlingar
# i en fast version, i delar om 15 minuter, och efter varje del
# datakontrollerna och en push på körningens egen gren, som får en PR.
# Samma kommandon och tidsbudget som kommunhandlingars nattkörning (där
# K11, K53, ADR-0052 och ADR-0088).
name: Nattkörning

on:
  schedule:
    - cron: "41 1 * * *"
    # Tills poolen är ikapp: tas bort när steg 2 inte längre har kandidater
    # som väntar på nästa körning.
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nattkorning
  cancel-in-progress: false

# `shell: bash` ger `-eo pipefail` i flödets egna steg, som i
# kungsbackakommun. Actionen levande sätter samma skal själv.
defaults:
  run:
    shell: bash

jobs:
  moten:
    name: Mötena
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      gren: ${{ steps.incheckning.outputs.gren }}
    steps:
      - name: Jobbets start, som tidsbudgeten räknas från, och dess gren
        run: |
          {
            echo "START=$(date +%s)"
            echo "DEL=moten"
            echo "GREN=nattkorning/$(date -u +%F)-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Tesseract med svensk modell
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      # Versionen står i kodversion.txt, inte här: GitHub vägrar körningen
      # att pusha en gren vars workflow-fil skiljer sig från main, så en ny
      # version här mitt i en körning kastade körningens arbete.
      - uses: ./.github/actions/installera
      # Delarna och incheckningen står i .github/nattkorning/ (K102, ADR-0125);
      # att en källa som stoppar upptäckten inte fäller jobbet står i
      # .github/actions/levande (K103, ADR-0126).
      - name: Upptäckt och steg 2, sparat var 15:e minut
        uses: ./.github/actions/levande
      # Också när körningen fallit: det som sparats har klarat kontrollerna.
      # Kod 2 från ls-remote är "grenen finns inte", och bara den är inget
      # nytt (K104, ADR-0127; samma som kungsbackakommuns
      # .github/actions/grenen vid 201a598c, utom raden om grenen).
      - name: Grenen, om något sparats
        id: incheckning
        if: always()
        run: |
          kod=0
          git ls-remote --exit-code origin "refs/heads/$GREN" > /dev/null || kod=$?
          if [ "$kod" -eq 0 ]; then
            echo "gren=$GREN" >> "$GITHUB_OUTPUT"
          elif [ "$kod" -eq 2 ]; then
            echo "Inget nytt i poolen." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gick inte att se om grenen \`$GREN\` finns; se loggen." >> "$GITHUB_STEP_SUMMARY"
            exit "$kod"
          fi
      # Samma som steget Sammanfattning i jobben i kungsbackakommuns
      # nattkorning.yml, lika vid 22ee0670 och main; håll dem lika (K105,
      # ADR-0128).
      - name: Sammanfattning
        if: always()
        run: |
          {
            echo '```'
            tail -n 200 "$RUNNER_TEMP/sammanfattning.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # En egen runner utan utcheckning, så att inget som hämtats kan nå token.
  # Kopia av kungsbackakommuns nattkorning-pr.yml vid 22ee0670 (K105,
  # ADR-0128); håll den lika det, och ta in senare ändringar där
  # (ADR-0115, ADR-0118) genom säkerhetsgenomgången i #58:
  # https://github.com/moggleif/kungsbackakommun/blob/22ee0670283ee5887a748434c708155f91ce18bd/.github/workflows/nattkorning-pr.yml
  # Skillnader: ett jobb och inte ett anropat flöde (token till ett annat
  # repo avgörs i #58), ingen del i titeln (bara mötena) och inga ADR-nummer
  # i texterna (de är kungsbackakommuns).
  pr:
    name: PR med automatisk merge
    needs: moten
    if: ${{ !cancelled() && needs.moten.outputs.gren != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.NATTKORNING_TOKEN }}
          GREN: ${{ needs.moten.outputs.gren }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Datat ligger på grenen \`$GREN\`; öppna en PR därifrån." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$GREN" \
            --title "Nattkörning ${GREN:12:10}" \
            --body "Datat från nattkörningen; mergas när kontrollen gått igenom."
          gh pr merge "$GREN" --repo "$GITHUB_REPOSITORY" --auto --merge
          echo "PR från \`$GREN\` mergas när kontrollen gått igenom." >> "$GITHUB_STEP_SUMMARY"
