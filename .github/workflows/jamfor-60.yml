# Tillfällig: jämförelsen för #60. Tas bort före merge.
name: Jämförelse 60
on:
  push:
    branches: [claude/project-thread-1rdrr0]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  fore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "$(cat kodversion.txt)"
      - &tal
        run: |
          python --version
          pip freeze
          : > "$RUNNER_TEMP/avvikelser.jsonl"
          python -m kommunhandlingar.webbplats "$RUNNER_TEMP/_site" \
            https://github.com/moggleif/regionhalland "$RUNNER_TEMP/avvikelser.jsonl" > /dev/null
          cd "$RUNNER_TEMP/_site"
          find . -type f | wc -l
          find . -type f | LC_ALL=C sort | sha256sum
          find . -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sed 's/Sidan byggdes [0-9-]* [0-9:]* UTC//' | sha256sum
  efter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/installera
      - *tal
  natt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tesseract med svensk modell
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - uses: ./.github/actions/installera
      - run: |
          python --version
          tesseract --list-langs
          python -c "import kommunhandlingar.upptack, kommunhandlingar.hamta, kommunhandlingar.datakontroll"
          git status --porcelain
