# Datakontrollerna på varje PR och på main, med samma version av
# kommunhandlingar som nattkörningen. På PR:en byggs också webbplatsen,
# som prövar sidorna över tid mot källans text.
name: Kontroll

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kontroll:
    name: Datakontrollerna
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Samma version som nattkörningen
        uses: ./.github/actions/installera
      - name: Kommunfilen går att läsa
        run: |
          for kommunfil in kommuner/*.toml; do
            python -c "import sys; from pathlib import Path; from kommunhandlingar.konfiguration import las; las(Path(sys.argv[1]))" "$kommunfil"
          done
      - name: Datakontrollerna
        run: |
          if [ -d data ]; then python -m kommunhandlingar.datakontroll data; fi
      # Bygget fälls av en rad i en spårfil som inte står på källans sida, så
      # felet syns före merge (K106, ADR-0129 i kungsbackakommuns serie).
      # Nattkörningens PR hoppas över: den ändrar inga spårfiler, och ett fel
      # i dess data ska som förut inte hålla tillbaka den. På main bygger
      # webbplatsen ändå.
      - name: Webbplatsen byggs, utan att publiceras
        if: >
          github.event_name == 'pull_request'
          && !startsWith(github.head_ref, 'nattkorning/')
        run: |
          : > "$RUNNER_TEMP/avvikelser.jsonl"
          python -m kommunhandlingar.webbplats "$RUNNER_TEMP/_site" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "$RUNNER_TEMP/avvikelser.jsonl"
